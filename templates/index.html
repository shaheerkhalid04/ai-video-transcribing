<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Video Transcriber</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <main class="wrap">
    <header class="head">
      <h1>AI Video Transcriber</h1>
      <p class="tagline">
        Type a topic. The agent finds a YouTube video and transcribes it,
        using two tools it calls on its own.
      </p>
      <div class="tools-badges">
        <span class="badge">1 · Video search <em>SerpApi</em></span>
        <span class="badge">2 · Transcription <em>Gemini</em></span>
        <span class="badge">Agent <em>Groq</em></span>
      </div>
    </header>

    <form id="form" class="search">
      <input
        id="topic"
        type="text"
        placeholder="e.g. git explained in 100 seconds"
        autocomplete="off"
      />
      <button id="go" type="submit">Find &amp; Transcribe</button>
    </form>
    <p class="hint">Tip: shorter, less well-known videos transcribe best.</p>

    <div id="status" class="status" hidden></div>
    <div id="error" class="error" hidden></div>

    <section id="steps-box" class="card" hidden>
      <h2>Tools used</h2>
      <ol id="steps" class="steps"></ol>
    </section>

    <section id="result-box" class="card" hidden>
      <div class="result-head">
        <h2>Transcript</h2>
        <div class="result-actions">
          <a id="source" class="source" href="#" target="_blank" rel="noopener">Source</a>
          <button id="copy" class="copy" type="button">Copy</button>
        </div>
      </div>
      <pre id="transcript" class="transcript"></pre>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
